name: FixMyCode PSEO Autopilot

on:
  schedule:
    - cron: '0 3 * * *' # Run daily at 03:00 UTC
  workflow_dispatch: # Enable manual trigger from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for committing new manual extractions back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          elif [ -f "fixmycode/requirements.txt" ]; then
            pip install -r fixmycode/requirements.txt
          fi

      - name: Run Harvester & Extractor (New Manuals Discovery)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: |
          if [ -d "pipeline" ]; then
            python pipeline/1_harvester.py
            python pipeline/2_extractor.py
          elif [ -d "fixmycode/pipeline" ]; then
            python fixmycode/pipeline/1_harvester.py
            python fixmycode/pipeline/2_extractor.py
          fi

      - name: Trigger IndexNow Ping
        env:
          SITE_DOMAIN: ${{ secrets.SITE_DOMAIN }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -d "pipeline" ]; then
            python pipeline/3_indexnow.py
          elif [ -d "fixmycode/pipeline" ]; then
            python fixmycode/pipeline/3_indexnow.py
          fi

      - name: Commit Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ site/src/data/ fixmycode/data/ fixmycode/site/src/data/ 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update error database [skip ci]" && git push)
